<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styler.css">
    <title>Login Page</title>
</head>
<body>
    
    <div class="box">
        <form action="">
            <h1>Login</h1>
            <div>
            <label for="name" style="display: block;">Name: </label>
            <input type="text" id="name" style="display: block;" placeholder="Enter your Name">
            </div>

            <div>
            <label for="password" style="display: block;">Password: </label>
            <input type="password" id="password" style="display: block;" placeholder="Enter your Password">
            </div>

            <button>Login</button>

        </form>
    </div>

</body>
</html>
