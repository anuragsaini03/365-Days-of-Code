<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register for the university.</p>
    <hr>

    <form>
        <h3>Personal Details:</h3>
    
        <label for="name">First Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your first name" required>
        <br><br>
        <label for="surname">Last Name:</label>
        <input type="text" id="surname" name="surname" placeholder="Enter your last name" required>
        <br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>
        <h3>Gender:</h3>
   
        <input type="radio" name = "gender" id="male" value="male">
        <label for = "male" >Male</label>
        <br>
        <input type="radio" name = "gender" id = "female" value="female">
        <label for = "female" >Female</label>
        <br>
        <input type="radio" name = "gender" id = "other" value="other">
        <label for = "other" >Other</label>
        <br><br>

        <h3>Upload your Photo</h3>
        <input type="file" name = "photo" id = "photo" accept="image/*">
        <br><br>
        <hr>
        <h3>Contact Information:</h3>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        <br><br>
        <label for="address">Address:</label>
        <br>
        <textarea id="address" name="address" placeholder="Enter your address" required> </textarea>
        <hr>
        <h3>Academic Information:</h3>
        <label for="course">Select Course:</label>
        <select name="course" id="course" required>
            <option value="">Select a course</option>
            <option value="cs">Computer Science</option>
            <option value="it">Information Technology</option>
            <option value="ee">Electrical Engineering</option>
        </select>
        <br><br>
        <h3>Extracurricular Activities:</h3>

        <input type="checkbox" name = "activities" id = "sports" value="sports">
        <label for = "sports" >Sports</label>
        <br>
        <input type="checkbox" name = "activities" id = "music" value="music">
        <label for = "music" >Music</label>
        <br>
        <input type="checkbox" name = "activities" id = "arts" value="arts">
        <label for = "arts" >Arts</label>
        <br><br>
        <hr>
        <h3>Create your Account</h3>
        <label>Create a Password:</label>
        <input type="password" name = "password" id = "password" placeholder="Enter your password" required>
        <br><br>
        <label>Security Question:</label>
        <select name="security_question" id="security_question" required>
            <option value="">Select a question</option>
            <option value="pet">What was the name of your first pet?</option>
            <option value="school">What was the name of your first school?</option>
            <option value="city">In which city were you born?</option>
        </select>
        <br><br>
        <label>Answer:</label>
        <input type="text" name = "security_answer" id = "security_answer" placeholder="Enter your answer" required>
        <br><br>
        <input type="checkbox" name = "terms" id = "terms" required>
        <label for = "terms" >I agree to the terms and conditions</label>

        <br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>
</body>
</html>
